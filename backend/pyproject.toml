[project]
name = "taskflow-api"
version = "1.0.0"
description = "Owner-scoped project and task API"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1", "sqlmodel>=0.0.27,<0.1",
  "alembic>=1.17,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.11,<3",
  "email-validator>=2.3,<3", "PyJWT>=2.10,<3", "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
